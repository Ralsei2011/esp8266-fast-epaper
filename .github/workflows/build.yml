name: build

on:
  workflow_dispatch:
    inputs:
      sketches:
        description: '要编译的 sketch 名（空格分隔）。留空 = 编译全部'
        required: false
        default: ''
  push:
    paths:
      - 'firmware/**'
      - 'research/**'
      - 'driver/**'
      - 'tools/patch_gxepd2.py'
      - '.github/workflows/build.yml'

# 三色线的 epd_font_test 依赖 cn_font.h（本机字体生成，不入库），CI 里跳过
env:
  SKIP: epd_font_test
  CORE_VERSION: '3.1.2'
  GXEPD2_VERSION: '1.6.9'
  # 基础设施排查模式：1 = push 时只编一个固件探路（省 CI 时间），
  # 0 = 编译全部。等 CI 稳定后改成 0。
  CI_QUICK: '1'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        run: |
          set -euo pipefail
          WANT="${{ github.event.inputs.sketches }}"
          if [ -z "$WANT" ] && [ "${CI_QUICK}" = "1" ]; then
            WANT="epd_demo"
            echo "::notice::CI_QUICK=1，本次只编译 epd_demo 探路"
          fi
          if [ -z "$WANT" ]; then
            WANT=$(find firmware research -name '*.ino' -printf '%h\n' | xargs -n1 basename | sort | tr '\n' ' ')
          fi
          LIST=""
          for s in $WANT; do
            [ "$s" = "${SKIP}" ] && { echo "::notice::跳过 $s（需本机生成 cn_font.h）"; continue; }
            LIST="$LIST $s"
          done
          JSON=$(printf '%s\n' $LIST | jq -R . | jq -s -c .)
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          echo "本次编译：$LIST"

  build:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        sketch: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.sketch }}
    steps:
      - uses: actions/checkout@v4

      # key 带 v3：旧的 ard-Linux-esp8266-3.1.2 缓存可能是不完整安装，
      # 会让 core install 误判"已装"而秒过，之后 compile 直接报 platform not found。
      - name: 缓存 ESP8266 core
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: ard-${{ runner.os }}-esp8266-${{ env.CORE_VERSION }}-v3

      - name: 安装 arduino-cli
        uses: arduino/setup-arduino-cli@v1

      - name: 安装 ESP8266 core
        run: |
          # 注意：GitHub 的默认 shell 自带 -e，必须显式 set +e，
          # 否则大括号块里第一条失败的命令就终止整个 step，后面的诊断代码根本跑不到。
          set +e
          LOG=/tmp/core-install.log
          {
            echo "=== version ==="
            arduino-cli version
            echo "=== config init ==="
            arduino-cli config init --overwrite
            echo "=== config add ==="
            arduino-cli config add board_manager.additional_urls \
              https://arduino.esp8266.com/stable/package_esp8266com_index.json
            echo "=== config dump ==="
            arduino-cli config dump
            echo "=== update-index ==="
            arduino-cli core update-index
            echo "update-index rc=$?"
            echo "=== 清理旧 core ==="
            arduino-cli core uninstall esp8266:esp8266
            echo "uninstall rc=$?"
            echo "=== install ==="
            arduino-cli core install esp8266:esp8266@${{ env.CORE_VERSION }}
            echo "install rc=$?"
          } > "$LOG" 2>&1
          rc=$?
          echo "===== core 安装日志（末尾 40 行）====="
          tail -40 "$LOG"
          if [ $rc -ne 0 ]; then
            # 末尾 8 行写进 annotation，可通过 check-runs/{id}/annotations 的 API 读到
            tail -8 "$LOG" | while IFS= read -r l; do
              l="${l//::/ }"
              l="${l//%/%25}"
              printf '::error title=core-install::%s\n' "${l:0:180}"
            done
            exit 1
          fi
          PLATFORM="$HOME/.arduino15/packages/esp8266/hardware/esp8266/${{ env.CORE_VERSION }}"
          if [ ! -f "$PLATFORM/boards.txt" ]; then
            printf '::error title=core-install::缺少 %s/boards.txt\n' "$PLATFORM"
            exit 1
          fi
          arduino-cli core list

      - name: 取依赖库（固定版本，保证可复现）
        run: |
          set -euo pipefail
          rm -rf libs
          mkdir -p libs
          git clone --depth 1 --branch ${{ env.GXEPD2_VERSION }} \
            https://github.com/ZinggJM/GxEPD2.git libs/GxEPD2
          git clone --depth 1 \
            https://github.com/olikraus/U8g2_for_Adafruit_GFX.git libs/U8g2_for_Adafruit_GFX
          ls -1 libs

      - name: 注入驱动扩展
        run: |
          set -euo pipefail
          python3 tools/patch_gxepd2.py --lib libs/GxEPD2

      - name: 编译 ${{ matrix.sketch }}
        run: |
          set -uo pipefail
          NAME="${{ matrix.sketch }}"
          # 不用 find | head -1：pipefail 下 find 收到 SIGPIPE 会让赋值失败并静默退出
          DIR=$(dirname "$(find firmware research -type d -name "$NAME" -print -quit)")
          echo "sketch 路径: $DIR/$NAME"
          if [ ! -d "$DIR/$NAME" ] || [ ! -f "$DIR/$NAME/$NAME.ino" ]; then
            echo "::error title=$NAME::找不到 sketch 目录或 $NAME.ino"
            exit 1
          fi
          # arduino-cli 不保证会创建这两级目录，缺了会立刻失败（表现为 0 秒退出）
          mkdir -p "build/$NAME" "out/$NAME"

          LOG="/tmp/build-$NAME.log"
          if arduino-cli compile \
               --fqbn esp8266:esp8266:generic:eesz=4M2M \
               --libraries libs \
               --build-path "$PWD/build/$NAME" \
               --output-dir "$PWD/out/$NAME" \
               --warnings default \
               "$DIR/$NAME" > "$LOG" 2>&1; then
            echo "===== 编译成功 ====="
            ls -l "out/$NAME"
          else
            echo "===== 编译失败，最后 40 行 ====="
            tail -40 "$LOG"
            # 把末尾几行写进 annotation，这样不用登录也能通过 check-runs API 读到
            tail -4 "$LOG" | while IFS= read -r l; do
              l="${l//::/ }"
              l="${l//%/%25}"
              printf '::error title=%s::%s\n' "$NAME" "${l:0:180}"
            done
            exit 1
          fi

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.sketch }}
          path: out/${{ matrix.sketch }}/*.bin
          if-no-files-found: error
          retention-days: 30
